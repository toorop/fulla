name: Bug report
description: Something in Fulla doesn't work as described
labels: [bug]
body:
  - type: input
    id: photoshop
    attributes:
      label: Photoshop version
      description: Help > System Info, first line (for example 27.10.0)
    validations:
      required: true
  - type: input
    id: fulla
    attributes:
      label: Fulla version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider and area
      multiple: true
      options: [OpenRouter, OpenAI, Google, Generate with a prompt, Generate with no prompt (remove or fill), Variations, Providers tab / connect, Install / panel]
  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: Steps, document size, selection, settings.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened
      description: The exact message the panel shows, and a screenshot if useful. Never paste your API key.
    validations:
      required: true
