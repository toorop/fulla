name: Feature request
description: Suggest an improvement (for a model or provider, use "Model or provider request")
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Fulla doesn't let you do today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: How it could work. Mockups welcome.
